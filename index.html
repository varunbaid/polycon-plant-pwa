<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5394">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Polycon Plant">
  <meta name="description" content="Polycon Plant Forms">
  <title>Polycon Plant Forms</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b5394; }
    #shell {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #0b5394;
    }
    #splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #ffffff;
      color: #202124;
      font-family: Roboto, Arial, sans-serif;
      text-align: center;
      z-index: 1;
    }
    #splash img { width: 128px; height: 128px; }
    #splash p { margin: 0; font-size: 18px; color: #5f6368; }
    #splash a, #fallback a {
      display: inline-block;
      margin-top: 8px;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      padding: 14px 24px;
      border-radius: 10px;
      min-height: 48px;
      line-height: 20px;
    }
    #fallback { display: none; }
    #fallback.show { display: block; }
    iframe#app {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f1f3f4;
      z-index: 2;
      opacity: 0;
    }
    iframe#app.ready { opacity: 1; }
  </style>
</head>
<body>
  <div id="shell">
    <div id="splash">
      <img src="icons/icon-192.png" alt="Polycon">
      <p>Polycon Plant Forms</p>
      <p id="status">Loading…</p>
      <div id="fallback">
        <a href="https://script.google.com/macros/s/AKfycbyRS_3C_qU_Suv6Kpgw7YwHlT9nu1gUTAlVHD7E-Rml0IEqLdyObzKtjxPzVSCONwwr/exec" target="_top" rel="noopener">Open</a>
      </div>
    </div>
    <iframe id="app"
      title="Polycon Plant Forms"
      src="https://script.google.com/macros/s/AKfycbyRS_3C_qU_Suv6Kpgw7YwHlT9nu1gUTAlVHD7E-Rml0IEqLdyObzKtjxPzVSCONwwr/exec"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; autoplay"
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <script>
    (function () {
      var frame = document.getElementById('app');
      var fallback = document.getElementById('fallback');
      var status = document.getElementById('status');
      var loaded = false;
      function showApp() {
        loaded = true;
        frame.classList.add('ready');
      }
      function showFallback() {
        if (loaded) return;
        status.textContent = 'If the app does not appear, tap Open.';
        fallback.classList.add('show');
      }
      frame.addEventListener('load', showApp);
      frame.addEventListener('error', showFallback);
      setTimeout(function () { if (!loaded) showFallback(); }, 10000);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    })();
  </script>
</body>
</html>
